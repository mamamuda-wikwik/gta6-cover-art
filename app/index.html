<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <header>
      <h1>Vice City Cover Studio</h1>
      <p>Your photo, made into GTA-style cover art. Pick a photo, place it in the panels, write the caption, export the cover.</p>
    </header>

    <section class="group">
      <h2>1 · Photos</h2>
      <label>Photo A <input id="photo-a" type="file" accept="image/*"></label>
      <label>Photo B <input id="photo-b" type="file" accept="image/*"></label>
      <label>Fill every panel with
        <select id="fill-all">
          <option value="">— choose —</option>
          <option value="a">Photo A</option>
          <option value="b">Photo B</option>
          <option value="pier">Sample: Pier</option>
          <option value="boulevard">Sample: Boulevard</option>
        </select>
      </label>
    </section>

    <section class="group">
      <h2>2 · Panels</h2>
      <div id="panel-pick" class="row"></div>
      <p id="panel-name" class="hint">Panel 1 of 4</p>
      <div class="row">
        <button type="button" data-panel-src="a">Photo A</button>
        <button type="button" data-panel-src="b">Photo B</button>
        <button type="button" data-panel-src="pier">Pier</button>
        <button type="button" data-panel-src="boulevard">Blvd</button>
      </div>
      <label>Zoom <input id="zoom" type="range" min="0.8" max="2.5" step="0.05" value="1"></label>
      <label>Move left / right <input id="pan-x" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <label>Move up / down <input id="pan-y" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <p class="hint">Tip: click a panel in the preview, then drag it to move the photo.</p>
    </section>

    <section class="group">
      <h2>3 · Layout</h2>
      <div class="row">
        <button type="button" data-layout="poster" class="active">Poster</button>
        <button type="button" data-layout="duo">Duo</button>
        <button type="button" data-layout="trio">Trio</button>
      </div>
    </section>

    <section class="group">
      <h2>4 · Neon grade</h2>
      <div class="row">
        <button type="button" data-grade="sunset" class="active swatch sunset">Sunset</button>
        <button type="button" data-grade="neon" class="swatch neon">Neon</button>
        <button type="button" data-grade="gold" class="swatch gold">Gold</button>
      </div>
    </section>

    <section class="group">
      <h2>5 · Words</h2>
      <label>Small line <input id="kicker" type="text" maxlength="24" value="VICE CITY"></label>
      <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
    </section>

    <section class="group">
      <h2>6 · Export</h2>
      <div class="row">
        <button type="button" data-size="square" class="active">1080 × 1080</button>
        <button type="button" data-size="tall">1080 × 1350</button>
        <button type="button" data-size="wide">1920 × 1080</button>
      </div>
      <button id="export" type="button" class="primary">Export PNG — this size</button>
      <button id="export-all" type="button">Export all 3 sizes</button>
      <p id="status" role="status"></p>
    </section>
  </section>

  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
